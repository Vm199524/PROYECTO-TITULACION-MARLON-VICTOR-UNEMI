<svg xmlns="http://www.w3.org/2000/svg" width="13.333in" height="7.5in" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="p64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="p002E45" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002E45"/></marker><marker id="p1E7A4C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7A4C"/></marker><marker id="p0B5C7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B5C7E"/></marker><marker id="pFF6900" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/><rect x="0" y="0" width="960" height="28" fill="#002E45"/><rect x="0" y="28" width="960" height="2.5" fill="#FF6900"/><text x="12.0" y="14.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">VicMar · Del almacén al modelo: entrenamiento, validación y calificación (backend/ml)</text><text x="948.0" y="14.0" font-size="10" font-weight="normal" fill="#D6E4EC" text-anchor="end" dominant-baseline="central">Marlon David Pérez Almachi y Víctor Manuel Lluilema Pisco · UNEMI 2026</text><g data-caja="1"><rect x="16" y="60" width="214" height="92" rx="6" fill="#002E45" stroke="#002E45" stroke-width="1.2"/><text x="20.0" y="70.2" font-size="10.5" font-weight="bold" fill="#FFB27A" text-anchor="start" dominant-baseline="central">1 · Lectura</text><text x="20.0" y="82.3" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ml/datos.leer_historial()</text><text x="20.0" y="94.1" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ALMACEN_ACADEMICO, cuenta</text><text x="20.0" y="105.9" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">DB_USER, filtrado por</text><text x="20.0" y="117.7" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">institución</text></g><path d="M230.0,106.0 L252.0,106.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="2"><rect x="252" y="60" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="256.0" y="70.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">2 · Panel estudiante-periodo</text><text x="256.0" y="82.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">caracteristicas.construir_panel()</text><text x="256.0" y="94.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">variables hasta t; etiqueta =</text><text x="256.0" y="105.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">abandono en t+1 (sin fuga)</text><text x="256.0" y="117.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">grupos opcionales detectados</text></g><path d="M466.0,106.0 L488.0,106.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="3"><rect x="488" y="60" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="492.0" y="70.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">3 · Partición temporal</text><text x="492.0" y="82.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">particion_temporal(): periodos</text><text x="492.0" y="94.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">más recientes (≥ 25 %) =</text><text x="492.0" y="105.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">prueba, usada una sola vez</text></g><path d="M702.0,106.0 L724.0,106.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="4"><rect x="724" y="60" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="728.0" y="70.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">4 · CV agrupada</text><text x="728.0" y="82.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">StratifiedGroupKFold, 5 pliegues</text><text x="728.0" y="94.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">por estudiante: nunca en</text><text x="728.0" y="105.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">ambos lados</text></g><g data-caja="5"><rect x="16" y="220" width="214" height="92" rx="6" fill="#FFF1E6" stroke="#FF6900" stroke-width="1.2"/><text x="20.0" y="230.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">5 · 4 candidatos</text><text x="20.0" y="242.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">RF con pesos · RF + SMOTE</text><text x="20.0" y="254.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">(solo en el pliegue) · Logística</text><text x="20.0" y="265.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">· LightGBM (Optuna TPE);</text><text x="20.0" y="277.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">RF con búsqueda aleatoria</text></g><path d="M230.0,266.0 L252.0,266.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="6"><rect x="252" y="220" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="256.0" y="230.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">6 · Selección</text><text x="256.0" y="242.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">mayor ROC-AUC medio</text><text x="256.0" y="254.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">(desempate PR-AUC)</text></g><path d="M466.0,266.0 L488.0,266.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="7"><rect x="488" y="220" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="492.0" y="230.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">7 · Calibración de Platt</text><text x="492.0" y="242.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">calibracion.CalibradorPlatt</text><text x="492.0" y="254.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">sobre predicciones fuera</text><text x="492.0" y="265.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">de pliegue</text></g><path d="M702.0,266.0 L724.0,266.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="8"><rect x="724" y="220" width="214" height="92" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="728.0" y="230.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">8 · Umbrales</text><text x="728.0" y="242.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">MEDIO: recall ≥ 0,80</text><text x="728.0" y="254.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">ALTO: recall ≥ 0,50</text><text x="728.0" y="265.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">(umbral_para_recall)</text></g><g data-caja="9"><rect x="16" y="380" width="214" height="108" rx="6" fill="#EAF6EF" stroke="#1E7A4C" stroke-width="1.2"/><text x="20.0" y="390.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">9 · Evaluación</text><text x="20.0" y="402.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">temporal: ROC-AUC, PR-AUC, Brier</text><text x="20.0" y="414.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">prospectiva OULAD 2014J</text><text x="20.0" y="425.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">(reporte_validacion) · por</text><text x="20.0" y="437.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">periodo y carrera · origen móvil</text><text x="20.0" y="449.5" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">· equidad por género y modalidad</text></g><path d="M230.0,426.0 L252.0,426.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="10"><rect x="252" y="380" width="214" height="108" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="256.0" y="390.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">10 · Guardar</text><text x="256.0" y="402.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">ml/modelos/&lt;INST&gt;/</text><text x="256.0" y="414.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">modelo_abandono.joblib,</text><text x="256.0" y="425.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">metricas.json ·</text><text x="256.0" y="437.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">fact_evaluacion_modelo</text></g><path d="M466.0,426.0 L488.0,426.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="11"><rect x="488" y="380" width="214" height="108" rx="6" fill="#FFF1E6" stroke="#FF6900" stroke-width="1.2"/><text x="492.0" y="390.2" font-size="10.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">11 · MLflow</text><text x="492.0" y="402.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">mlops/registro_mlflow.py</text><text x="492.0" y="414.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">una corrida por entrenamiento;</text><text x="492.0" y="425.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">datos_locales/mlflow (local)</text></g><path d="M702.0,426.0 L724.0,426.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="12"><rect x="724" y="380" width="214" height="108" rx="6" fill="#002E45" stroke="#002E45" stroke-width="1.2"/><text x="728.0" y="390.2" font-size="10.5" font-weight="bold" fill="#FFB27A" text-anchor="start" dominant-baseline="central">12 · Calificar y segmentar</text><text x="728.0" y="402.3" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ml.calificar: probabilidad,</text><text x="728.0" y="414.1" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ALTO/MEDIO/BAJO, SHAP top 3,</text><text x="728.0" y="425.9" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">PSI · mlops: GX y Evidently ·</text><text x="728.0" y="437.7" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ml.segmentar: K-means</text></g><path d="M831.0,152.0 L831.0,186.0 L123.0,186.0 L123.0,220.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><path d="M831.0,312.0 L831.0,346.0 L123.0,346.0 L123.0,380.0" fill="none" stroke="#0B5C7E" stroke-width="1.4" marker-end="url(#p0B5C7E)"/><g data-caja="13"><rect x="16" y="500" width="928" height="32" rx="6" fill="#FFFFFF" stroke="#0B5C7E" stroke-width="1.2"/><text x="480.0" y="516.0" font-size="10" font-weight="normal" fill="#14232E" text-anchor="middle" dominant-baseline="central">Resultado: fact_prediccion_abandono y fact_segmento_carrera → vistas VIS_* → panel, ficha, consulta y reportes (un modelo por institución)</text></g></svg>