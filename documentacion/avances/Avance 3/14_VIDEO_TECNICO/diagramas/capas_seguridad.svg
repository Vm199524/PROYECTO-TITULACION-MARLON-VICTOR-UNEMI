<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="13.333in" height="7.5in" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="p64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="p002E45" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002E45"/></marker><marker id="p1E7A4C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7A4C"/></marker><marker id="p0B5C7E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B5C7E"/></marker><marker id="pFF6900" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/><rect x="0" y="0" width="960" height="28" fill="#002E45"/><rect x="0" y="28" width="960" height="2.5" fill="#FF6900"/><text x="12.0" y="14.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">VicMar · Defensa en profundidad: capas de seguridad</text><text x="948.0" y="14.0" font-size="10" font-weight="normal" fill="#D6E4EC" text-anchor="end" dominant-baseline="central">Marlon David Pérez Almachi y Víctor Manuel Lluilema Pisco · UNEMI 2026</text><g data-caja="1"><rect x="16" y="44" width="640" height="104" rx="6" fill="#EBF5FA" stroke="#0B5C7E" stroke-width="1.2"/><text x="20.0" y="55.7" font-size="13" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">1 · Interfaz</text><text x="20.0" y="70.4" font-size="12" font-weight="bold" fill="#0B5C7E" text-anchor="start" dominant-baseline="central">frontend/src</text><text x="20.0" y="84.6" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Rutas &lt;Protegida requiere=capacidad&gt; (App.tsx, lib/permisos.ts); token en sessionStorage; un 401 cierra la sesión; la</text><text x="20.0" y="98.7" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">ficha se abre por token, no por cédula</text></g><g data-caja="2"><rect x="38" y="162" width="596" height="104" rx="6" fill="#FFFFFF" stroke="#0B5C7E" stroke-width="1.2"/><text x="42.0" y="173.7" font-size="13" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">2 · API, JWT y roles</text><text x="42.0" y="188.4" font-size="12" font-weight="bold" fill="#0B5C7E" text-anchor="start" dominant-baseline="central">core/seguridad.py · api/*</text><text x="42.0" y="202.6" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">JWT HS256 con vencimiento, bcrypt, cuenta revalidada en cada petición, X-Institucion asignada (403),</text><text x="42.0" y="216.7" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">requiere(capacidad): 3 roles y 15 capacidades, 5 intentos → 429, CORS y cabeceras nosniff/DENY/no-store</text></g><g data-caja="3"><rect x="60" y="280" width="552" height="104" rx="6" fill="#FFF1E6" stroke="#FF6900" stroke-width="1.2"/><text x="64.0" y="291.7" font-size="13" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">3 · Motor de consulta</text><text x="64.0" y="306.4" font-size="12" font-weight="bold" fill="#0B5C7E" text-anchor="start" dominant-baseline="central">backend/nl2sql</text><text x="64.0" y="320.6" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Barreras de intención; 40 métricas certificadas con SQL fijo; depurar_texto() antes de la IA; validador</text><text x="64.0" y="334.7" font-size="12" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">sqlglot (un SELECT, solo VIS_*, sin funciones peligrosas, TOP 500)</text></g><g data-caja="4"><rect x="82" y="398" width="508" height="104" rx="6" fill="#002E45" stroke="#002E45" stroke-width="1.2"/><text x="86.0" y="409.7" font-size="13" font-weight="bold" fill="#FFB27A" text-anchor="start" dominant-baseline="central">4 · Base de datos</text><text x="86.0" y="424.4" font-size="12" font-weight="bold" fill="#FFB27A" text-anchor="start" dominant-baseline="central">crear_almacen_academico.sql · core/db.py</text><text x="86.0" y="438.6" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Vistas VIS_* filtradas por SESSION_CONTEXT (@read_only=1, falla cerrada); chat_reader</text><text x="86.0" y="452.7" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">solo SELECT en 8 vistas; app_seguimiento solo 2 procedimientos; DB_USER solo lotes;</text><text x="86.0" y="466.9" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Encrypt=yes; CHECK_POLICY=ON</text></g><path d="M8.0,50.0 L8.0,520.0" fill="none" stroke="#002E45" stroke-width="1.4" marker-end="url(#p002E45)"/><g data-caja="5"><rect x="680" y="44" width="264" height="222" rx="6" fill="#FFFFFF" stroke="#0B5C7E" stroke-width="1.2"/><text x="684.0" y="54.8" font-size="11.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">Auditoría (transversal)</text><text x="684.0" y="67.5" font-size="10" font-weight="bold" fill="#0B5C7E" text-anchor="start" dominant-baseline="central">core/auditoria.py</text><text x="684.0" y="79.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">auditoria.jsonl de solo agregado</text><text x="684.0" y="91.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">INGRESO, CONSULTA, INTERPRETACION, FICHA,</text><text x="684.0" y="102.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">SIMULACION, SEGUIMIENTO_ALTA/CIERRE,</text><text x="684.0" y="114.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">EXPORTACION, CUENTA_*, CAMBIO_CLAVE</text><text x="684.0" y="126.5" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Huella SHA-256 del SQL o del mensaje, nunca los datos</text><text x="684.0" y="138.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Se revisa en admin/Auditoria (ADMIN_TI)</text></g><g data-caja="6"><rect x="680" y="280" width="264" height="252" rx="6" fill="#FFF1E6" stroke="#FF6900" stroke-width="1.2"/><text x="684.0" y="290.8" font-size="11.5" font-weight="bold" fill="#002E45" text-anchor="start" dominant-baseline="central">LOPDP (transversal)</text><text x="684.0" y="303.5" font-size="10" font-weight="bold" fill="#0B5C7E" text-anchor="start" dominant-baseline="central">core/privacidad.py</text><text x="684.0" y="315.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Minimización: a la IA solo la pregunta depurada; al</text><text x="684.0" y="327.1" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">interpretar ≤ 25 filas seudonimizadas sin texto libre</text><text x="684.0" y="338.9" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Acceso: cédula ******1234 en pantalla</text><text x="684.0" y="350.7" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Seguridad: token Fernet (AES-128-CBC +</text><text x="684.0" y="362.5" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">HMAC-SHA256), vigencia 24 h</text><text x="684.0" y="374.3" font-size="10" font-weight="normal" fill="#14232E" text-anchor="start" dominant-baseline="central">Datos de prueba sintéticos o anonimizados</text></g></svg>