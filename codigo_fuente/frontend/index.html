    <!--
        Fondo oscuro en línea, directo en el <head> (30/08/2026, a pedido
        del usuario: la ventana se abre en blanco ~3s antes de verse el
        tema real). La clase de Tailwind "bg-[#020617]" del <body> no sirve
        para esto: Tailwind se inyecta vía JS/Vite, así que hasta que ese
        bundle carga, el navegador pinta su blanco por defecto — la "mala
        imagen" que reportó. Un <style> plano aquí no depende de ningún JS:
        el navegador lo aplica al instante, en el primer pintado.
    -->
    <style>html,body{background:#020617;margin:0}</style>
    <!--
        NOTA (31/08/2026): aquí vivía una copia estática en HTML/CSS de la
        tarjeta de login ("ACCEDER AL SISTEMA"), pensada para pintarse en el
        primer frame mientras cargaba el bundle de React. Se eliminó a pedido
        del usuario: era una tarjeta MUERTA — su botón era un <div> sin
        controlador, así que durante los 2-3 s previos al montaje de React el
        usuario veía un login que no reaccionaba a los clics. Un placeholder
        que parece interactivo pero no lo es resulta peor que el fondo oscuro.
        Si en el futuro se quiere volver a cubrir ese hueco, debe hacerse con
        algo que NO simule un control accionable (por ejemplo, solo el logo).
    -->
</head>

<body class="bg-[#020617]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
