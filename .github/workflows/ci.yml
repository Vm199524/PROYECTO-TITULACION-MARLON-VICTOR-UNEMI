name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo_fuente/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: codigo_fuente/backend/requirements.txt
      - name: Controlador ODBC del sistema (lo requiere pyodbc)
        run: sudo apt-get update -q && sudo apt-get install -yq unixodbc
      - run: pip install -r requirements.txt
      - name: Pruebas (las de integración se omiten sin SQL Server)
        run: |
          python -m pytest -q -W ignore 2>&1 | tee salida.txt
          echo "### Backend: $(tail -n 1 salida.txt)" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo_fuente/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codigo_fuente/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
