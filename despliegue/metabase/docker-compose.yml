# Metabase como alternativa de consulta (inteligencia de negocios clásica).
#
# Se conecta a ALMACEN_ACADEMICO con la cuenta metabase_lector, que solo puede
# leer el esquema bi (datos agregados, sin identificadores personales). Ver
# documentacion/tecnica/METABASE_ALTERNATIVA_DE_CONSULTA.md.
#
# Uso (desde la raíz del proyecto, con SQL Server ya en marcha):
#   docker compose -f despliegue/metabase/docker-compose.yml up -d
#   abrir http://localhost:3001 y agregar la base de datos:
#     tipo SQL Server · host host.docker.internal · puerto 1433
#     base ALMACEN_ACADEMICO · usuario metabase_lector
#
# Autores: Marlon David Pérez Almachi, Víctor Manuel Lluilema Pisco
# Proyecto de titulación · Universidad Estatal de Milagro · 2026
services:
  metabase:
    image: metabase/metabase:v0.63.21
    container_name: vicmar-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_LOCALE: es
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: America/Guayaquil
    volumes:
      - metabase-data:/metabase-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  metabase-data:
